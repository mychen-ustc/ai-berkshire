name: CI

# 提交前门禁强制化(P1)：把手动跑的 465 回归测试 + 代码质量门禁 + 治理体检
# 变成每次 push/PR 自动强制运行——关闭诊断"零 L5/无 .github/workflows"缺口的通用刚性。
# 全零外部依赖(纯 stdlib)，故 CI 极简：无 pip install。

on:
  push:
    branches: [main, feat/martin]
  pull_request:
    branches: [main]

# 同分支新推送取消旧运行，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 测试 + 代码门禁 + 治理体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 回归测试（全零依赖 stdlib，纯函数 + golden）
        run: python3 -m unittest discover -s tests -v

      - name: 代码质量硬门禁（AST：循环变量遮蔽 / 语法 / 未用导入）
        run: python3 tools/code_gate.py check --path tools/ --errors-only

      - name: 模型治理体检（--strict：validated 却无测试文件即阻断）
        run: python3 tools/model_registry.py audit --strict

      # 失败结果通知：配了 NOTIFY_WEBHOOK secret 则推飞书/Slack；否则 GitHub 默认失败邮件兜底。
      # 注意：secrets 不能用于 if: 条件(GitHub 限制)，故在 shell 里判空。
      - name: 失败通知（webhook，可选）
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTIFY_WEBHOOK_KIND: ${{ secrets.NOTIFY_WEBHOOK_KIND }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$NOTIFY_WEBHOOK" ]; then
            python3 tools/notify.py send --level crit \
              --title "CI 失败 ${{ github.ref_name }}@${{ github.sha }}" \
              --message "测试/门禁/治理未通过，见 $RUN_URL"
          else
            echo "未配置 NOTIFY_WEBHOOK secret，跳过 webhook（GitHub 默认失败邮件兜底）。"
          fi
